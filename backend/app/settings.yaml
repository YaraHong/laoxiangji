# 老乡鸡智能客服 - 运行环境配置
app:
  name: laoxiangji
  debug: true

# 数据库配置
database:
  host: localhost
  port: 5432
  user: postgres
  password: "121221"
  name: laoxiangji
  url: postgresql+asyncpg://postgres:121221@localhost:5432/laoxiangji

# Redis 配置
redis:
  host: localhost
  port: 6379
  db: 0
  password: "121221"
  url: redis://:121221@localhost:6379/0

# AI 模型配置
models:
  chat:
    api_key: "sk-c882730bd0204687a6c1b45cde0c1f83"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-v4-pro"
  embedding:
    api_key: "your-dashscope-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "Qwen3-Embedding-8B"
  intent:
    api_key: "sk-c882730bd0204687a6c1b45cde0c1f83"
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-v4-flash"

# Milvus 向量数据库
milvus:
  host: localhost
  port: 19530
  collection: laoxiangji_knowledge
  dim: 1024

# MinIO 对象存储
minio:
  endpoint: localhost:19000
  access_key: admin
  secret_key: admin123456
  bucket: knowledge
  secure: false

# Celery 异步任务
celery:
  broker_url: redis://:121221@localhost:6379/1
  result_backend: redis://:121221@localhost:6379/2

# 文本切分策略
text_splitter:
  chunk_size: 500
  chunk_overlap: 100
  separators: [ "\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", "" ]

